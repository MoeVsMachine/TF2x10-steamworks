name: Release

# Publishing a tag builds both plugins and attaches a ready-to-extract archive.
# The tag must equal the tf2x10 plugin version, which in turn must equal the
# "Latest" entry in update.txt, or the Updater will chase a version that never
# arrives. tools/check-version.sh enforces all three.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the plugin versions
        run: ./tools/check-version.sh "${GITHUB_REF_NAME}"

      - name: Build
        run: ./tools/build.sh compiled

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # Only what a server needs, laid out as it sits under tf2/ and with no
          # wrapper directory, so `unzip tf2x10-<version>.zip -d tf2/` is the whole
          # install. Sources stay in the repository and in the loose assets.
          staging="$RUNNER_TEMP/tf2x10-${version}"
          mkdir -p "$staging/addons/sourcemod/plugins" \
                   "$staging/addons/sourcemod/configs"
          cp compiled/tf2x10.smx compiled/tf2items_randomizer.smx "$staging/addons/sourcemod/plugins/"
          cp addons/sourcemod/configs/x10.*.txt "$staging/addons/sourcemod/configs/"
          ( cd "$staging" && zip -qr "$GITHUB_WORKSPACE/tf2x10-${version}.zip" addons )
          unzip -l "tf2x10-${version}.zip"

      - name: Write the release notes
        run: |
          set -euo pipefail
          versions=$(./tools/check-version.sh "${GITHUB_REF_NAME}")
          tf2x10=$(printf '%s\n' "$versions" | awk '/^tf2x10\.sp/ {print $2}')
          randomizer=$(printf '%s\n' "$versions" | awk '/^randomizer/ {print $2}')
          notes=$(sed -n 's/^[[:space:]]*"Notes"[[:space:]]*"\(.*\)".*/\1/p' addons/sourcemod/update.txt | head -n 1)

          cat > RELEASE_NOTES.md <<EOF
          Built from ${GITHUB_SHA::7} with SourceMod 1.12.0.7255.

          | plugin | version |
          |---|---|
          | tf2x10.smx | ${tf2x10} |
          | tf2items_randomizer.smx | ${randomizer} |

          ## Install

          Download \`tf2x10-${GITHUB_REF_NAME}.zip\` and extract it into your \`tf2\` folder. The archive is laid out as \`addons/sourcemod/...\` with no top-level directory, so the plugins and configs land where SourceMod reads them. Delete \`plugins/tf2items_randomizer.smx\` if you do not want the randomizer; tf2x10 does not need it. Each file is attached individually as well.

          Both plugins stop at startup without \`addons/sourcemod/gamedata/tf2items.randomizer.txt\`, which comes with [TF2Items] Randomizer. tf2x10 also needs TF2Items, TF2Attributes, SteamWorks and optionally Updater; the randomizer needs TF2Items and TF2Attributes.

          ## Notes

          ${notes}
          EOF
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          gh release create "$version" \
            --title "TF2x10 ${version}" \
            --notes-file RELEASE_NOTES.md \
            "tf2x10-${version}.zip" \
            compiled/tf2x10.smx \
            compiled/tf2items_randomizer.smx \
            addons/sourcemod/configs/x10.default.txt \
            addons/sourcemod/configs/x10.vshff2.txt \
            addons/sourcemod/configs/x10.aprilfools.txt
